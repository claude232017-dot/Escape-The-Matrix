name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The browser job consumes this rather than rebuilding. Rebuilding inside the
      # readiness budget of the preview server is how that job times out on a cold cache.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  database:
    name: Migrations and RLS posture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Without a health check the job races the container and fails on connection
        # refused, intermittently, which reads as a flaky test rather than a missing wait.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # 127.0.0.1, not localhost: on a dual-stack runner localhost can resolve to ::1
      # while the mapped port listens on IPv4 only.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations and assert the RLS posture
        run: npm run db:test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: verify
    # A hung step must fail fast rather than sit on the 6-hour default. This job is ~2
    # minutes of real work; anything past 15 is stuck, and a stuck job that eventually
    # times out having run zero tests is indistinguishable from a broken one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Resolved rather than hardcoded, so the cache key cannot silently go stale against
      # a bumped @playwright/test and serve a browser build the runner then rejects.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No `--with-deps`. The GitHub-hosted ubuntu image already carries Chromium's
      # shared libraries, and the apt step it adds can block indefinitely on a dpkg lock —
      # observed hanging past 20 minutes on this workflow's first run, with zero tests
      # executed. Downloading only the browser takes seconds and needs no root.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
