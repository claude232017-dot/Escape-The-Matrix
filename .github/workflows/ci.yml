name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Pinned, and it is the cache key. Bumping it here is the whole upgrade: the next run
  # misses the cache and fetches the new binary. Keep it in step with POSTGREST_VERSION in
  # scripts/db/postgrest.ts, which is what a developer downloads locally.
  POSTGREST_VERSION: 'v12.2.3'

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Phase 9. Previously a manual step at each phase gate, which is a step that gets skipped
      # under pressure — exactly when a dependency advisory matters most.
      #
      # `high` rather than `moderate`: this app has no server of its own, a tiny dependency tree
      # and twelve users, so a moderate advisory in a build-time package is not worth a red
      # pipeline that people learn to ignore. A high or critical one is.
      #
      # `--omit=dev` is deliberately NOT passed. A compromised build-time dependency ships
      # whatever it likes into the bundle every member loads.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      # The production build, exactly as it would be deployed. Run first and separately from
      # the harness build below so that a failure here is unambiguous.
      - name: Build
        run: npm run build

      # The browser suite drives the SITREP screen through a harness that renders it with
      # fixture data and no session, which is the only way to *measure* the sixty-second
      # filing gate rather than assert it. `--mode harness` loads .env.harness; a normal
      # build does not, and tests/unit/harness-excluded.test.ts (run in the step above)
      # proves the harness cannot reach a production bundle.
      - name: Build with the test harness
        run: npm run build:harness

      # The browser job consumes this rather than rebuilding. Rebuilding inside the
      # readiness budget of the preview server is how that job times out on a cold cache.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  database:
    name: Migrations and RLS posture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Without a health check the job races the container and fails on connection
        # refused, intermittently, which reads as a flaky test rather than a missing wait.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # 127.0.0.1, not localhost: on a dual-stack runner localhost can resolve to ::1
      # while the mapped port listens on IPv4 only.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations and assert the RLS posture
        run: npm run db:test

      # The suite that would have caught the two Phase 4 bugs, both of which shipped with
      # every other test green: a domain cast PostgREST emits and `tests/db` does not, and an
      # embed with no foreign key behind it. Neither is visible without a real server.
      #
      # The binary is cached by version, so this is a download on a cold cache and a no-op
      # afterwards. It is fetched here rather than vendored because a 20 MB binary in the
      # repository is a worse trade than thirty seconds on a cache miss.
      - name: Cache PostgREST
        id: postgrest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/postgrest
          key: postgrest-${{ env.POSTGREST_VERSION }}

      - name: Install PostgREST
        if: steps.postgrest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/postgrest
          curl -sSLf -o /tmp/postgrest.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          tar xf /tmp/postgrest.tar.xz -C ~/.cache/postgrest
          chmod +x ~/.cache/postgrest/postgrest

      - name: API tests against a real PostgREST
        env:
          POSTGREST_BIN: /home/runner/.cache/postgrest/postgrest
        run: npm run test:api

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: verify
    # A hung step must fail fast rather than sit on the 6-hour default. This job is ~2
    # minutes of real work; anything past 15 is stuck, and a stuck job that eventually
    # times out having run zero tests is indistinguishable from a broken one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Resolved rather than hardcoded, so the cache key cannot silently go stale against
      # a bumped @playwright/test and serve a browser build the runner then rejects.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No `--with-deps`. The GitHub-hosted ubuntu image already carries Chromium's
      # shared libraries, and the apt step it adds can block indefinitely on a dpkg lock —
      # observed hanging past 20 minutes on this workflow's first run, with zero tests
      # executed. Downloading only the browser takes seconds and needs no root.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
